name: proof-of-play
on: [push, pull_request, workflow_dispatch]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node --test check.test.mjs
      # ⚑ Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness — the ownership law re-proves itself, forever
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness
          node /tmp/witness/witness.mjs mutate check.mjs --timeout 60000 --cap 400 --test node --test check.test.mjs | tee verdict.txt
          grep -q '"clean": true' verdict.txt || { echo "::error::mutants survived — the gate is not clean"; exit 1; }
      - name: the wire — the Action shell answers a real fixture, dry
        run: |
          out=$(GITHUB_EVENT_PATH=test/fixture-event.json SEAM_SHADOW=shadow.json SEAM_DRY=1 node run.mjs)
          echo "$out"
          echo "$out" | grep -q "you already own this" || { echo "::error::the fixture PR did not get its verdict"; exit 1; }
          GITHUB_EVENT_PATH=test/fixture-event.json SEAM_SHADOW=shadow.json SEAM_DRY=1 SEAM_FAIL_ON=already-owned node run.mjs && { echo "::error::the wall did not fail"; exit 1; } || echo "wall exits 1 — correct"
      - name: the page IS the kernel — the rebuild must be a fixpoint
        run: |
          node build-page.mjs
          git diff --exit-code index.html || { echo "::error::index.html drifted from its kernels — rebuild and commit"; exit 1; }
      - name: the bell — hear the verdict
        if: always()
        run: |
          echo "### 🔔 the verdict, ready to ring — paste it at [the-bell](https://sjgant80-hub.github.io/the-bell/)" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          tail -c 2000 verdict.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo '{"note":"gate did not reach the witness step"}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
